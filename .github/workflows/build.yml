name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          for project in main preload renderer test; do
            npx tsc --project "tsconfig.$project.json" --noEmit
          done
      - run: npm test

  # Windows x64 is the only distributed build (ADR 0007). A v* tag publishes the
  # installer and update metadata to a draft GitHub Release for the maintainer to publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      # The installer carries the app's Google OAuth client so users can publish
      # without setup. It lives only in this secret, never in the public repo.
      - name: Write the OAuth credentials
        shell: bash
        env:
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CREDENTIALS" ]; then
            echo "::error::The GOOGLE_OAUTH_CREDENTIALS secret is not set; the installer could not sign in to Google"
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_CREDENTIALS" > build/credentials.json
          node -e "const c = require('./build/credentials.json'); if (!(c.installed ?? c.web ?? c).client_id) { throw new Error('credentials.json has no client_id'); }"
      - run: npm run test:audio
      - run: npm run build
      # electron-builder uploads in parallel; with no release yet, each upload can
      # create its own draft. Creating the draft first gives them one target.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
      - name: Package and publish
        run: npx electron-builder --win --x64 --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
